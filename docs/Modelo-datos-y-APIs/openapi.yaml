openapi: 3.1.0
info:
  title: ASTHA Local Sync Hub & Telemetry Adapter API
  version: 3.0.0
  description: |
    Formal OpenAPI 3.1.0 specification for the local network interfaces (isolated spacecraft LAN, Zero-WAN)
    and data contracts of ASTHA (Autonomous Space Telemetry & Health Analytics).
    Aligned with SRS v1.0, C4 Model, and ADRs 001..020 (specifically ADR-006, ADR-007, ADR-008, ADR-009, ADR-010, ADR-012, and ADR-014).
  contact:
    name: ASTHA Engineering Team — NASA Space Apps Challenge 2026
    url: https://github.com/angelcontres/AstroVital-SpaceApps
servers:
  - url: https://astha.local:8443/api/v1
    description: Spacecraft Closed-LAN Sync Hub (TLS 1.3 with Internal CA - ADR-007 / ADR-008)
  - url: http://localhost:8443/api/v1
    description: Local Development / Demonstration Environment

tags:
  - name: SyncHub
    description: Star-topology Zero-Knowledge CRDT synchronization (ADR-008 / ADR-009)
  - name: CabinDisplay
    description: Habitat telemetry and global traffic light with zero clinical data (ADR-014)
  - name: TelemetryAdapter
    description: Ingestion contract for future physical sensors (SRS §5.2)

paths:
  /health:
    get:
      tags: [SyncHub]
      summary: Checks Sync Hub health and PWA bundle version
      operationId: getHubHealth
      responses:
        "200":
          description: Sync Hub operational on the closed LAN
          content:
            application/json:
              schema:
                type: object
                required: [status, hubVersion, bundleHashSha256, oplogSequence, mdnsHost]
                properties:
                  status:
                    type: string
                    enum: [ONLINE, DEGRADED]
                  hubVersion:
                    type: string
                    example: "3.0.0"
                  bundleHashSha256:
                    type: string
                    description: SHA-256 hash of the app shell for the Service Worker (RNF-POW-04)
                  oplogSequence:
                    type: integer
                    minimum: 0
                  mdnsHost:
                    type: string
                    example: "astha.local"
                  enrolledDevices:
                    type: integer
                    minimum: 0
                  enrolledDeviceIds:
                    type: array
                    items:
                      type: string
                    description: Sorted list of 12-character Ed25519 key fingerprints enrolled on the hub (zero PII)
                  autoEnroll:
                    type: boolean
                    description: Whether unknown devices proving Ed25519 key possession auto-enroll on handshake

  /sync/handshake:
    post:
      tags: [SyncHub]
      summary: Exchanges VersionVector and validates client device Ed25519 signature
      description: Implements discovery and verification of Earth-enrolled peers (ADR-009, ADR-020).
      operationId: postSyncHandshake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, versionVector, timestampUtc, ed25519Signature]
              properties:
                deviceId:
                  type: string
                  example: "tablet-c001"
                versionVector:
                  $ref: "#/components/schemas/VersionVector"
                timestampUtc:
                  type: string
                  format: date-time
                ed25519Signature:
                  type: string
      responses:
        "200":
          description: Handshake accepted; returns list of missing envelopes for the client
          content:
            application/json:
              schema:
                type: object
                required: [hubVersionVector, missingEnvelopeIds]
                properties:
                  hubVersionVector:
                    $ref: "#/components/schemas/VersionVector"
                  missingEnvelopeIds:
                    type: array
                    items:
                      type: string
                      format: uuid
        "401":
          description: Device not enrolled in the internal CA or invalid Ed25519 signature

  /sync/deltas:
    get:
      tags: [SyncHub]
      summary: Downloads missing EncryptedEnvelope deltas (Zero-Knowledge at the Hub)
      description: The Sync Hub delivers only AES-GCM-256 encrypted envelopes; it never has access to plaintext clinical data (ADR-012).
      operationId: getSyncDeltas
      parameters:
        - name: since_hlc
          in: query
          required: false
          description: Hybrid Logical Clock (HLC) from which to retrieve deltas
          schema:
            type: string
            example: "1794800000000:0000:tablet-c001"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Batch of encrypted envelopes ordered by HLC
          content:
            application/json:
              schema:
                type: object
                required: [envelopes, hubVersionVector]
                properties:
                  envelopes:
                    type: array
                    items:
                      $ref: "#/components/schemas/EncryptedEnvelope"
                  hubVersionVector:
                    $ref: "#/components/schemas/VersionVector"

    post:
      tags: [SyncHub]
      summary: Submits new CRDT encrypted envelopes to the Sync Hub append-only Op-Log
      operationId: postSyncDeltas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, envelopes]
              properties:
                deviceId:
                  type: string
                envelopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/EncryptedEnvelope"
      responses:
        "202":
          description: Envelopes verified (SHA-256 + Ed25519) and appended to the Op-Log
          content:
            application/json:
              schema:
                type: object
                required: [acceptedCount, rejectedIds, oplogTipSeq]
                properties:
                  acceptedCount:
                    type: integer
                  rejectedIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  oplogTipSeq:
                    type: integer
        "422":
          description: Cryptographic verification failure on SHA-256 (SEU) or Ed25519 signature

  /habitat/status:
    get:
      tags: [CabinDisplay]
      summary: ECLSS/CANS environmental telemetry and global traffic light per crew member (ADR-014)
      description: |
        Consumed by public cabin displays. Under Privacy Act / HIPAA (ADR-012 and ADR-014),
        including individual biomedical values, affected organs, or diagnoses is strictly prohibited.
      operationId: getCabinGlobalStatus
      responses:
        "200":
          description: Habitat environmental state and aggregated traffic light
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CabinGlobalStatus"

  /ingest/telemetry:
    post:
      tags: [TelemetryAdapter]
      summary: JSON contract for future sensor adapter (SRS §5.2)
      description: |
        Enables coupling real bio-monitoring suits (Astroskin) or ECLSS buses without modifying the clinical core.
        Complies with RF-ING-05: values outside physiological range are flagged isSuspect=true without discarding.
      operationId: postIngestTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crewId, measurement, habitat]
              properties:
                crewId:
                  type: string
                  enum: [C001, C002, C003, C004]
                measurement:
                  $ref: "#/components/schemas/DailyMeasurement"
                habitat:
                  $ref: "#/components/schemas/HabitatTelemetry"
                symptoms:
                  type: array
                  items:
                    $ref: "#/components/schemas/SubjectiveSymptomType"
      responses:
        "201":
          description: Record validated and queued to the Clinical Engine Worker
          content:
            application/json:
              schema:
                type: object
                required: [recordId, isSuspect, evaluationLatencyBudgetMs]
                properties:
                  recordId:
                    type: string
                    format: uuid
                  isSuspect:
                    type: boolean
                  evaluationLatencyBudgetMs:
                    type: number
                    example: 50.0

components:
  schemas:
    VersionVector:
      type: object
      description: HLC logical sequence map for each spacecraft device (ADR-009)
      additionalProperties:
        type: string
        example: "1794800000000:0004:tablet-c001"

    EncryptedEnvelope:
      type: object
      description: IndexedDB / Op-Log cryptographic envelope (ADR-006, RNF-SEC-01/03/04)
      required: [id, hlc, autor, iv, ct, sha256, firma]
      properties:
        id:
          type: string
          format: uuid
        hlc:
          type: string
          pattern: '^\d+:\d+:[a-zA-Z0-9-]+$'
          example: "1794800000000:0001:tablet-c001"
        autor:
          type: string
          example: "tablet-c001"
        iv:
          type: string
          description: 96-bit AES-GCM initialization vector in Base64
        ct:
          type: string
          description: AES-GCM-256 encrypted payload in Base64
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: Anti cosmic-ray SEU bit-flip checksum (RNF-SEC-03)
        firma:
          type: string
          description: Ed25519 digital signature of the issuing device

    DailyMeasurement:
      type: object
      description: Daily physiological measurement with the 9 mandatory variables from RF-ING-01 (ADR-016)
      required: [missionDay, hr, hrvRmssd, pas, pad, spo2, glucose, tempC, sleepHours, mood]
      properties:
        missionDay:
          type: integer
          minimum: 1
          maximum: 180
        hr:
          type: integer
          minimum: 25
          maximum: 220
        hrvRmssd:
          type: number
          minimum: 5
          maximum: 200
        pas:
          type: integer
          minimum: 60
          maximum: 260
        pad:
          type: integer
          minimum: 35
          maximum: 160
        spo2:
          type: number
          minimum: 65
          maximum: 100
        glucose:
          type: number
          minimum: 30
          maximum: 400
        tempC:
          type: number
          minimum: 34.0
          maximum: 42.0
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
        mood:
          type: integer
          minimum: 1
          maximum: 10
        urinaryCalciumMgDay:
          type: number
          minimum: 0
          maximum: 1000
        isSuspect:
          type: boolean
          default: false

    HabitatTelemetry:
      type: object
      description: ECLSS environmental telemetry and CANS dosimetry (RF-ING-02, RF-DSH-04)
      required: [missionDay, ppCo2Mmhg, cabinPressureKpa, o2Percent, radiationUSvH]
      properties:
        missionDay:
          type: integer
          minimum: 1
          maximum: 180
        ppCo2Mmhg:
          type: number
        cabinPressureKpa:
          type: number
        o2Percent:
          type: number
        radiationUSvH:
          type: number

    SubjectiveSymptomType:
      type: string
      description: Closed catalog of 6 tactile symptoms (SRS §5.1 + RF-ING-04)
      enum:
        - blurredVision
        - headache
        - nausea
        - lumbarPain
        - orthostaticDizziness
        - extremeFatigue

    CabinGlobalStatus:
      type: object
      description: Public bulkhead view compliant with ADR-014 (no private biomedical data)
      required: [updatedAtHlc, habitat, crewTrafficLights]
      properties:
        updatedAtHlc:
          type: string
        habitat:
          $ref: "#/components/schemas/HabitatTelemetry"
        crewTrafficLights:
          type: array
          items:
            type: object
            required: [crewId, globalStatus, hasUnacknowledgedCritical5Min]
            properties:
              crewId:
                type: string
                enum: [C001, C002, C003, C004]
              globalStatus:
                type: string
                enum: [NOMINAL, CAUTION, CRITICAL]
              hasUnacknowledgedCritical5Min:
                type: boolean
                description: Automatic escalation after 5 min without acknowledgment (ADR-013)

    CountermeasureProtocol:
      type: object
      description: Countermeasure protocol strictly capped at <= 4 steps (ADR-017)
      required: [protocolId, anatomicalImpactBlock, severityTimeBlock, onboardResource, steps]
      properties:
        protocolId:
          type: string
        anatomicalImpactBlock:
          type: string
        severityTimeBlock:
          type: string
        onboardResource:
          type: string
          enum: [ARED, LBNP, BOTIQUIN, REFUGIO_SPE, FILTROS_LIOH_CDRA]
        steps:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
        chainedNextProtocolId:
          type: string
          nullable: true

    SignedDsnExport:
      type: object
      description: Ed25519-signed JSON package handed off outside ASTHA to the spacecraft DTN router (ADR-010, RNF-NET-04)
      required: [exportSchemaVersion, generatedAtUtc, missionId, isAnonymized, signerDeviceId, auditChainTipSha256, ed25519Signature]
      properties:
        exportSchemaVersion:
          type: string
          example: "astha-dsn-v1.0"
        generatedAtUtc:
          type: string
          format: date-time
        missionId:
          type: string
          example: "DST-1-MARS-TRANSIT"
        isAnonymized:
          type: boolean
          description: Mandatory true if intended for non-medical statistical use (ADR-012)
        signerDeviceId:
          type: string
        auditChainTipSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        ed25519Signature:
          type: string
