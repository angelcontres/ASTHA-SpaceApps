name: ASTHA PWA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-astha-pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astha-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astha-pwa/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - name: Verify dist/ bundle size <= 5 MB (RNF-POW-04)
        run: |
          BYTES=$(du -sb dist | cut -f1)
          echo "astha-pwa/dist size: ${BYTES} bytes (limit: 5242880 bytes)"
          test "$BYTES" -le 5242880
