name: ASTHA PWA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-astha-pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astha-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astha-pwa/package-lock.json
      - run: npm ci
      - run: npm run verify
