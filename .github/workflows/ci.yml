name: ASTHA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-astha-pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astha-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astha-pwa/package-lock.json
      - run: npm ci
      - run: npm run verify

  verify-sync-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-hub
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (preinstalled rustup on ubuntu-latest)
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sync-hub/target
          key: sync-hub-${{ runner.os }}-${{ hashFiles('sync-hub/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astha-pwa/package-lock.json
      - name: PWA SyncClient <-> Rust hub end-to-end
        working-directory: astha-pwa
        run: |
          npm ci
          ASTHA_HUB_BIN=../sync-hub/target/debug/astha-sync-hub npx vitest run tests/hub.e2e.test.ts

  verify-docker-image:
    needs: verify-astha-pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose config -q
          ASTHA_DOMAIN=astha.example.com docker compose --profile tls config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ASTHA PWA container image
        uses: docker/build-push-action@v6
        with:
          context: ./astha-pwa
          file: ./astha-pwa/Dockerfile
          load: true
          tags: astha-pwa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test hardened container runtime
        run: |
          docker run -d --name astha-smoke \
            --read-only \
            --tmpfs /tmp:noexec,nosuid,size=16m \
            --tmpfs /var/cache/nginx:noexec,nosuid,size=32m \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:8080:8080 \
            astha-pwa:ci

          trap 'docker logs astha-smoke || true; docker rm -f astha-smoke || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -qx "ok"; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/healthz | grep -qx "ok"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "X-Frame-Options: DENY"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "X-Content-Type-Options: nosniff"
          curl -fsSI http://127.0.0.1:8080/sw.js | grep -qi "no-store"
          curl -fsSI http://127.0.0.1:8080/manifest.webmanifest | grep -qi "application/manifest+json"
          curl -fsS http://127.0.0.1:8080/icon.svg | grep -q "<svg"

      - name: Build Sync Hub container image
        uses: docker/build-push-action@v6
        with:
          context: ./sync-hub
          file: ./sync-hub/Dockerfile
          load: true
          tags: astha-hub:ci
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

      - name: Smoke test Sync Hub container (read-only, non-root, enroll, graceful stop)
        run: |
          docker run -d --name hub-smoke --read-only --security-opt no-new-privileges:true \
            -p 127.0.0.1:8443:8443 astha-hub:ci
          trap 'docker logs hub-smoke || true; docker rm -f hub-smoke || true' EXIT
          for i in $(seq 1 20); do
            docker exec hub-smoke /usr/local/bin/astha-sync-hub healthcheck && break
            sleep 1
          done
          docker exec hub-smoke /usr/local/bin/astha-sync-hub healthcheck
          curl -fsS http://127.0.0.1:8443/api/v1/health | grep -q '"status":"ONLINE"'
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8443/api/v1/habitat/status | grep -qx 503
          RECORD=$(python3 -c "import json;print(json.dumps(json.load(open('sync-hub/tests/fixtures/pwa_vectors.json'))['enrolled'][0]))")
          docker exec hub-smoke /usr/local/bin/astha-sync-hub enroll "$RECORD"
          curl -fsS http://127.0.0.1:8443/api/v1/health | grep -q '"oplogSequence":0'
          timeout 5 docker stop hub-smoke
