name: ASTHA CD & Auto-Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astha-pwa/package-lock.json

      - name: Run full verification gate
        working-directory: astha-pwa
        run: |
          npm ci
          npm run verify

      - name: Prepare GHCR image metadata
        id: prep
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}-pwa" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.prep.outputs.sha_tag }}
            type=semver,pattern={{version}}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./astha-pwa
          file: ./astha-pwa/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable deployed tag
        id: publish
        run: |
          IMAGE_REF="${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-aws:
    needs: build-and-publish-image
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ASTHA container stack on self-hosted AWS host
        env:
          IMAGE_REF: ${{ needs.build-and-publish-image.outputs.image_ref }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/astha' }}
          ASTHA_DOMAIN: ${{ vars.ASTHA_DOMAIN }}
          ASTHA_HTTP_PORT_VAR: ${{ vars.ASTHA_HTTP_PORT || '80' }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DOCKER="docker"
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker binary not found on $(hostname) (user: $(id -un))."
            if sudo -n true >/dev/null 2>&1; then
              echo "Bootstrapping Docker Engine + Compose plugin via deploy/server-bootstrap.sh..."
              DEPLOY_DIR="${DEPLOY_DIR}" DEPLOY_USER="$(id -un)" ENABLE_UFW=0 bash deploy/server-bootstrap.sh
            else
              echo "ERROR: 'docker' not installed and passwordless sudo unavailable." >&2
              echo "Run on the EC2 host: curl -fsSL https://raw.githubusercontent.com/angelcontres/ASTHA-SpaceApps/main/deploy/server-bootstrap.sh | bash" >&2
              exit 1
            fi
          fi
          if ! docker info >/dev/null 2>&1; then
            if sudo -n docker info >/dev/null 2>&1; then
              DOCKER="sudo -n docker"
            elif sudo -n systemctl start docker >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              DOCKER="sudo -n docker"
            else
              echo "ERROR: Docker daemon is not accessible by user '$(id -un)' (groups: $(id -Gn))." >&2
              docker info 2>&1 || true
              sudo -n systemctl status docker --no-pager 2>&1 || true
              exit 1
            fi
          fi
          $DOCKER compose version

          if [ ! -d "${DEPLOY_DIR}/deploy" ]; then
            mkdir -p "${DEPLOY_DIR}/deploy" 2>/dev/null || sudo mkdir -p "${DEPLOY_DIR}/deploy"
          fi
          if [ ! -w "${DEPLOY_DIR}" ] || [ ! -w "${DEPLOY_DIR}/deploy" ]; then
            sudo chown -R "$(id -un):$(id -gn)" "${DEPLOY_DIR}"
          fi

          cp docker-compose.yml "${DEPLOY_DIR}/docker-compose.yml"
          cp deploy/Caddyfile "${DEPLOY_DIR}/deploy/Caddyfile"

          if [ -n "$ASTHA_DOMAIN" ]; then
            BIND_ADDR="127.0.0.1"
            HTTP_PORT="8080"
            COMPOSE_PROFILE="--profile tls"
          else
            BIND_ADDR="0.0.0.0"
            HTTP_PORT="${ASTHA_HTTP_PORT_VAR}"
            COMPOSE_PROFILE=""
          fi

          printf 'ASTHA_IMAGE=%s\nASTHA_BIND_ADDR=%s\nASTHA_HTTP_PORT=%s\nASTHA_DOMAIN=%s\n' \
            "$IMAGE_REF" "$BIND_ADDR" "$HTTP_PORT" "${ASTHA_DOMAIN:-localhost}" > "${DEPLOY_DIR}/.env"

          trap '$DOCKER logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$GHCR_TOKEN" | $DOCKER login ghcr.io -u "$GHCR_ACTOR" --password-stdin

          cd "$DEPLOY_DIR"
          $DOCKER compose --env-file "${DEPLOY_DIR}/.env" $COMPOSE_PROFILE pull
          $DOCKER compose --env-file "${DEPLOY_DIR}/.env" $COMPOSE_PROFILE up -d --no-build --remove-orphans

          for i in $(seq 1 20); do
            if $DOCKER exec astha-pwa wget -qO- http://127.0.0.1:8080/healthz | grep -qx "ok"; then
              echo "Container healthcheck passed."
              break
            fi
            sleep 1
          done
          $DOCKER exec astha-pwa wget -qO- http://127.0.0.1:8080/healthz | grep -qx "ok"

          if [ -z "$COMPOSE_PROFILE" ]; then
            curl -fsS "http://127.0.0.1:${HTTP_PORT}/healthz" | grep -qx "ok"
          else
            curl -fsS "http://127.0.0.1:8080/healthz" | grep -qx "ok"
          fi

          $DOCKER image prune -f
          $DOCKER compose --env-file "${DEPLOY_DIR}/.env" $COMPOSE_PROFILE ps

          {
            echo "### ASTHA Self-Hosted Production Deployment"
            echo ""
            echo "- **Runner:** \`${RUNNER_NAME:-self-hosted}\`"
            echo "- **Image:** \`${IMAGE_REF}\`"
            echo "- **Mode:** \`${ASTHA_DOMAIN:-http-only (port ${HTTP_PORT})}\`"
            if [ -n "$ASTHA_DOMAIN" ]; then
              echo "- **URL:** https://${ASTHA_DOMAIN}"
            else
              echo "- **Note:** Set GitHub Actions variable \`ASTHA_DOMAIN\` to enable automatic Caddy HTTPS (required for Web Crypto Ed25519 & Service Worker on public origins)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
