name: ASTHA CD & Auto-Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astha-pwa/package-lock.json

      - name: Run full verification gate
        working-directory: astha-pwa
        run: |
          npm ci
          npm run verify

      - name: Prepare GHCR image metadata
        id: prep
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}-pwa" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.prep.outputs.sha_tag }}
            type=semver,pattern={{version}}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./astha-pwa
          file: ./astha-pwa/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable deployed tag
        id: publish
        run: |
          IMAGE_REF="${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-aws:
    needs: build-and-publish-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy container stack to AWS host via SSH
        env:
          IMAGE_REF: ${{ needs.build-and-publish-image.outputs.image_ref }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/astha' }}
          ASTHA_DOMAIN: ${{ vars.ASTHA_DOMAIN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            {
              echo "### Auto-deploy skipped (AWS SSH secrets not yet configured)"
              echo ""
              echo "Image \`${IMAGE_REF}\` is published to GHCR. To enable automatic rollout to AWS EC2/Lightsail, add:"
              echo "- Secrets: \`SSH_HOST\`, \`SSH_USER\`, \`SSH_PRIVATE_KEY\`"
              echo "- Optional Variables: \`ASTHA_DOMAIN\`, \`SSH_PORT\`, \`DEPLOY_DIR\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts

          SSH_OPTS="-i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15"

          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_DIR}/deploy'"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            docker-compose.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            deploy/Caddyfile "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/deploy/Caddyfile"

          if [ -n "$ASTHA_DOMAIN" ]; then
            BIND_ADDR="127.0.0.1"
            HTTP_PORT="8080"
            COMPOSE_PROFILE="--profile tls"
          else
            BIND_ADDR="0.0.0.0"
            HTTP_PORT="80"
            COMPOSE_PROFILE=""
          fi

          printf 'ASTHA_IMAGE=%s\nASTHA_BIND_ADDR=%s\nASTHA_HTTP_PORT=%s\nASTHA_DOMAIN=%s\n' \
            "$IMAGE_REF" "$BIND_ADDR" "$HTTP_PORT" "${ASTHA_DOMAIN:-localhost}" | \
            ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cat > '${DEPLOY_DIR}/.env'"

          printf '%s\n' "$GHCR_TOKEN" | \
            ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "docker login ghcr.io -u '${GHCR_ACTOR}' --password-stdin"

          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" bash -s -- "$DEPLOY_DIR" "$COMPOSE_PROFILE" <<'REMOTE'
            set -euo pipefail
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            DEPLOY_DIR="$1"
            COMPOSE_PROFILE="$2"
            cd "$DEPLOY_DIR"
            docker compose $COMPOSE_PROFILE pull
            docker compose $COMPOSE_PROFILE up -d --remove-orphans
            for i in $(seq 1 20); do
              if docker exec astha-pwa wget -qO- http://127.0.0.1:8080/healthz | grep -qx "ok"; then
                echo "Healthcheck passed."
                break
              fi
              sleep 1
            done
            docker exec astha-pwa wget -qO- http://127.0.0.1:8080/healthz | grep -qx "ok"
            docker image prune -f
          REMOTE

          echo "Deployed \`${IMAGE_REF}\` to \`${SSH_HOST}\` (${ASTHA_DOMAIN:-http-only})." >> "$GITHUB_STEP_SUMMARY"
