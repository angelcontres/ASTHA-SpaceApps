<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="ASTHA · monitoreo biomédico autónomo offline para tripulaciones de espacio profundo" />
    <title>ASTHA</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Fondo OLED antes de cargar el CSS: sin destello blanco en el arranque (RNF-POW-02). -->
    <style>html,body{background:#030712;color:#e5e7eb;margin:0}</style>
  </head>
  <body>
    <!-- Filtro night-red-630 (RNF-USA-03): luminancia al canal rojo, verde y azul atenuados. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="night-red-630" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.45 0.75 0.15 0 0  0.06 0.12 0.03 0 0  0.02 0.04 0.01 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
